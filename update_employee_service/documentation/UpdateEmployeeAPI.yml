
openapi: 3.0.0
info:
  title: Update Employee API
  description: API for updating existing employee information
  version: 1.0.0
servers:
  - url: https://{apiGatewayId}.execute-api.{region}.amazonaws.com/Prod
    variables:
      apiGatewayId:
        default: defaultApiGatewayId
        description: API Gateway ID
      region:
        default: us-east-1
        description: AWS Region
paths:
  /employees/{employee_id}:
    put:
      summary: Update employee information
      description: Updates the information of an existing employee
      operationId: updateEmployee
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                department:
                  type: string
                position:
                  type: string
      responses:
        '200':
          description: Employee updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      firstName:
                        type: string
                      lastName:
                        type: string
                      email:
                        type: string
                      department:
                        type: string
                      position:
                        type: string
                  host_ip:
                    type: string
                    description: Host IP address of the server
        '400':
          description: Invalid input
        '404':
          description: Employee not found
        '500':
          description: Internal server error