
openapi: 3.0.0
info:
  title: Get Employee API
  description: API for retrieving employee information
  version: 1.0.0
servers:
  - url: https://{apiGatewayId}.execute-api.{region}.amazonaws.com/Prod
    variables:
      apiGatewayId:
        default: defaultApiGatewayId
        description: API Gateway ID
      region:
        default: us-east-1
        description: AWS Region
paths:
  /employees/{employee_id}:
    get:
      summary: Get employee by ID
      description: Retrieves detailed information about a specific employee
      operationId: getEmployee
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the employee
      responses:
        '200':
          description: Employee found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      firstName:
                        type: string
                      lastName:
                        type: string
                      email:
                        type: string
                      department:
                        type: string
                      position:
                        type: string
                  host_ip:
                    type: string
                    description: Host IP address of the server
        '404':
          description: Employee not found
        '500':
          description: Internal server error