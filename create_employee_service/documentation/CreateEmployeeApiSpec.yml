
openapi: 3.0.0
info:
  title: Create Employee API
  description: API for creating new employees in the system
  version: 1.0.0
servers:
  - url: https://{apiGatewayId}.execute-api.{region}.amazonaws.com/Prod
    variables:
      apiGatewayId:
        default: defaultApiGatewayId
        description: API Gateway ID
      region:
        default: us-east-1
        description: AWS Region
paths:
  /employees:
    post:
      summary: Create a new employee
      description: Creates a new employee record in the system
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
              properties:
                firstName:
                  type: string
                  example: "John"
                lastName:
                  type: string
                  example: "Doe"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                department:
                  type: string
                  example: "Engineering"
                position:
                  type: string
                  example: "Software Engineer"
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      firstName:
                        type: string
                      lastName:
                        type: string
                      email:
                        type: string
                      department:
                        type: string
                      position:
                        type: string
        '400':
          description: Invalid input
        '500':
          description: Internal server error