
openapi: 3.0.0
info:
  title: Delete Employee API
  description: API for deleting employees from the system
  version: 1.0.0
servers:
  - url: https://{apiGatewayId}.execute-api.{region}.amazonaws.com/Prod
    variables:
      apiGatewayId:
        default: defaultApiGatewayId
        description: API Gateway ID
      region:
        default: us-east-1
        description: AWS Region
paths:
  /employees/{employee_id}:
    delete:
      summary: Delete employee
      description: Deletes an employee from the system
      operationId: deleteEmployee
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the employee to delete
      responses:
        '204':
          description: Employee deleted successfully
        '404':
          description: Employee not found
        '500':
          description: Internal server error