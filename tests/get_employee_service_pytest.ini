[pytest]
# Add get_employee_service/src and shared layer to PYTHONPATH
pythonpath =
    ../../get_employee_service/get_employee_lambda/src
    ../../commons/layers/shared/python

# Run only tests in the get_employee_service tests folder
testpaths = get_employee_service

# Coverage settings
addopts =
    --cov=handler
    --cov=service
    --cov=dao
    --cov=backend_ip_client
    --cov-report=html:tests/coverage/get_employee_service/report
    --cov-report=term-missing
