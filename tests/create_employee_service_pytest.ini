[pytest]
# Add create_employee_service/src and shared layer to PYTHONPATH
pythonpath =
    ../../create_employee_service/create_employee_lambda/src
    ../../commons/layers/shared/python

# Run only tests in the create_employee_service tests folder
testpaths = create_employee_service

# Coverage settings
addopts =
    --cov=handler
    --cov=service
    --cov=dao
    --cov=backend_ip_client
    --cov-report=html:tests/coverage/create_employee_service/report
    --cov-report=term-missing
