AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Shared Resources Template
Parameters:
  TableName:
    Type: String
    Default: Employees
    Description: DynamoDB table name for employee records
Resources:
  EmployeeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Ref: TableName
      AttributeDefinitions:
      - AttributeName: employee_id
        AttributeType: S
      KeySchema:
      - AttributeName: employee_id
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
Outputs:
  EmployeeTableName:
    Description: Name of the Employee DynamoDB table
    Value:
      Ref: EmployeeTable
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-EmployeeTableName
  EmployeeTableArn:
    Description: ARN of the Employee DynamoDB table
    Value:
      Fn::GetAtt:
      - EmployeeTable
      - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-EmployeeTableArn
