AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Create Employee Lambda Function

Globals:
  Api:
    EndpointConfiguration: REGIONAL
    Cors:
      AllowMethods: "'POST'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
      AllowOrigin: "'*'"
  Function:
    Timeout: 10
    Runtime: python3.13
    Architectures:
      - x86_64
    Tracing: Active

Resources:
  SharedLayerResource:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: shared-layer
      ContentUri: ../../commons/layers/shared
      CompatibleRuntimes:
        - python3.13

  EmployeeApiGatewayResource:
    Type: AWS::Serverless::Api
    Properties:
      Name: create-employees-api-gateway
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        ApiKeyRequired: true

  CreateEmployeeLambdaFunctionResource:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CreateEmployeeFunction
      CodeUri: ../../create_employee_service/create_employee_lambda/src/
      Handler: handler.create_employee_handler.lambda_handler
      Layers:
        - !Ref SharedLayerResource
      Environment:
        Variables:
          TABLE_NAME: !ImportValue shared-resources-stack-EmployeeTableName
          LOG_LEVEL: INFO
      Events:
        CreateEmployeeAPI:
          Type: Api
          Properties:
            RestApiId: !Ref EmployeeApiGatewayResource
            Path: /employees
            Method: post
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !ImportValue shared-resources-stack-EmployeeTableArn

  CreateEmployeeAPIGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CreateEmployeeLambdaFunctionResource.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EmployeeApiGatewayResource}/*/POST/employees"

  CreateEmployeeApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - EmployeeApiGatewayResource
    Properties:
      Name: CreateEmployeeApiKey
      Description: API Key for Create Employee API
      Enabled: true

  EmployeeApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - EmployeeApiGatewayResource
      - CreateEmployeeLambdaFunctionResource
    Properties:
      UsagePlanName: EmployeeApiUsagePlan
      Description: Usage plan for Employee API
      ApiStages:
        - ApiId: !Ref EmployeeApiGatewayResource
          Stage: Prod
      Quota:
        Limit: 1000
        Period: MONTH
      Throttle:
        BurstLimit: 10
        RateLimit: 5

  EmployeeApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    DependsOn: EmployeeApiUsagePlan
    Properties:
      KeyId: !Ref CreateEmployeeApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref EmployeeApiUsagePlan

Outputs:
  CreateEmployeeApiUrl:
    Description: API Gateway endpoint URL for Create Employee
    Value: !Sub "https://${EmployeeApiGatewayResource}.execute-api.${AWS::Region}.amazonaws.com/Prod/employees"

  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref EmployeeApiGatewayResource

  ApiKey:
    Description: API Key ID
    Value: !Ref CreateEmployeeApiKey